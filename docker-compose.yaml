services:
  outside-tracker:
    image: nathan5471/outside-tracker:latest
    container_name: outside-tracker
    ports:
      - "80:80"
    environment:
      - SERVER_NAME=mysql
      - USERNAME=user
      - PASSWORD=password
      - DATABASE_NAME=outside-tracker
      - JWT_SECRET=
    restart: unless-stopped
    depends_on:
      - mysql
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=outside-tracker
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
